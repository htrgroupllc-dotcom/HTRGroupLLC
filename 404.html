<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — HTR Group</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --bg: #0f172a;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #1b6fe8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 600px at 10% -10%, #1b6fe833, transparent 60%),
          radial-gradient(900px 500px at 110% 10%, #0ea5e933, transparent 55%),
          linear-gradient(180deg, #e8eef8 0%, #f8fafc 55%, #eef2f7 100%);
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid #dbe3f0;
        border-radius: 12px;
        padding: 28px 24px;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
        object-fit: contain;
        margin: 0 auto 12px;
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        line-height: 1.3;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 10px 16px;
        border-radius: 8px;
      }
      a:hover { filter: brightness(1.05); }
    </style>
  </head>
  <body>
    <main>
      <img src="/htr-logo-nobg.png" alt="HTR Group" width="56" height="56" />
      <h1>Page not found</h1>
      <p>This page does not exist. Return to the Hi-Tech Repair Group homepage to continue.</p>
      <a href="/">Back to homepage</a>
    </main>
  </body>
</html>
