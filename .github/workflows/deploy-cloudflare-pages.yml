name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  validate-bundle:
    runs-on: ubuntu-latest
    name: Validate Pages bundle (25 MiB limit)
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and verify deploy bundle
        run: bash .github/scripts/prepare-pages-deploy.sh .

  deploy:
    runs-on: ubuntu-latest
    needs: validate-bundle
    name: Deploy htrgrouptx.com static site
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare static deploy bundle
        run: bash .github/scripts/prepare-pages-deploy.sh .

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1f3039d6832ffd0d9b8ab3fb2c8b6788
        run: |
          set -euo pipefail
          raw="$CLOUDFLARE_API_TOKEN_RAW"
          token="$(printf '%s' "$raw" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e 's/^Bearer[[:space:]]*//' -e 's/^CLOUDFLARE_API_TOKEN=//')"
          token="$(printf '%s' "$token" | tr -d '[:space:]')"
          unset CLOUDFLARE_API_TOKEN_RAW raw
          export CLOUDFLARE_API_TOKEN="$token"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Update it in GitHub → Settings → Secrets → Actions."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN length after normalization: ${#CLOUDFLARE_API_TOKEN}"
          npx wrangler@3.90.0 whoami
          # Pages Functions publish can fail on transient Cloudflare Workers API errors.
          # Wrangler may still exit 0 with "couldn't ascertain the final status" while
          # the deployment never becomes Production — treat that as failure and retry.
          attempt=1
          max_attempts=8
          deploy_ok=0
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Cloudflare Pages deploy attempt ${attempt}/${max_attempts}…"
            set +e
            deploy_log="$(mktemp)"
            npx wrangler@3.90.0 pages deploy _pages_deploy --project-name=htrgrouptx --branch=main --commit-hash="${GITHUB_SHA}" 2>&1 | tee "$deploy_log"
            wr_ec=${PIPESTATUS[0]}
            set -e
            if [ "$wr_ec" -eq 0 ] && grep -q 'Deployment complete!' "$deploy_log" && ! grep -q "couldn't ascertain the final status" "$deploy_log"; then
              deploy_ok=1
              rm -f "$deploy_log"
              break
            fi
            echo "::warning::Cloudflare Pages deploy attempt ${attempt}/${max_attempts} incomplete (exit=${wr_ec}); retrying in 60s…"
            rm -f "$deploy_log"
            if [ "$attempt" -ge "$max_attempts" ]; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 60
          done
          if [ "$deploy_ok" -ne 1 ]; then
            echo "::error::Cloudflare Pages deploy failed after ${max_attempts} attempts (or status could not be confirmed)"
            exit 1
          fi
