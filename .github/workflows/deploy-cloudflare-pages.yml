name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy htrgrouptx.com static site
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1f3039d6832ffd0d9b8ab3fb2c8b6788
        run: |
          set -euo pipefail
          raw="$CLOUDFLARE_API_TOKEN_RAW"
          token="$(printf '%s' "$raw" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e 's/^Bearer[[:space:]]*//' -e 's/^CLOUDFLARE_API_TOKEN=//')"
          token="$(printf '%s' "$token" | tr -d '[:space:]')"
          unset CLOUDFLARE_API_TOKEN_RAW raw
          export CLOUDFLARE_API_TOKEN="$token"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Update it in GitHub → Settings → Secrets → Actions."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN length after normalization: ${#CLOUDFLARE_API_TOKEN}"
          mkdir -p _pages_deploy
          rsync -a \
            --exclude 'scripts/' \
            --exclude 'src/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'api-server/' \
            --exclude 'artifacts/' \
            --exclude 'attached_assets/' \
            --exclude 'dist/' \
            --exclude 'build/' \
            --exclude 'out/' \
            --exclude 'public/' \
            --exclude '.git/' \
            --exclude '*.zip' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'pnpm-lock.yaml' \
            --exclude 'pnpm-workspace.yaml' \
            --exclude 'vite.config.ts' \
            --exclude 'tsconfig*.json' \
            --exclude 'REPORT.md' \
            --exclude 'replit.md' \
            --exclude 'debug.log' \
            --exclude '.env.production' \
            ./ _pages_deploy/
          if find _pages_deploy -type f -size +25M | grep -q .; then
            echo "::error::Deploy bundle still contains files over Cloudflare 25 MiB limit:"
            find _pages_deploy -type f -size +25M -printf '%p %k KB\n'
            exit 1
          fi
          echo "Deploy bundle ready:"
          du -sh _pages_deploy
          npx wrangler@3.90.0 whoami
          npx wrangler@3.90.0 pages deploy _pages_deploy --project-name=htrgrouptx --branch=main --commit-hash="${GITHUB_SHA}"