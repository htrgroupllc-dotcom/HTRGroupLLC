name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy htrgrouptx.com static site
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1f3039d6832ffd0d9b8ab3fb2c8b6788
        run: |
          set -euo pipefail
          raw="$CLOUDFLARE_API_TOKEN_RAW"
          # Normalize common paste mistakes (Bearer prefix, quotes, KEY=value, whitespace)
          token="$(printf '%s' "$raw" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e 's/^Bearer[[:space:]]*//' -e 's/^CLOUDFLARE_API_TOKEN=//')"
          token="$(printf '%s' "$token" | tr -d '[:space:]')"
          unset CLOUDFLARE_API_TOKEN_RAW raw
          export CLOUDFLARE_API_TOKEN="$token"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Add it in GitHub repo Settings → Secrets → Actions (same token as DentalEquipSite repo)."
            exit 1
          fi
          if printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -q '[^A-Za-z0-9._-]'; then
            echo "::error::CLOUDFLARE_API_TOKEN contains invalid characters after normalization (use API Token value only, not Global API Key + email)"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN length after normalization: ${#CLOUDFLARE_API_TOKEN}"
          npx wrangler@3.90.0 whoami
          npx wrangler@3.90.0 pages deploy . --project-name=htrgrouptx --branch=main --commit-hash="${GITHUB_SHA}"